[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyforge-test"
version = "0.3.0"
description = "A lightweight Python unit testing framework with decorator-based test collection and execution."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["testing", "framework", "unittest", "pytest", "decorator", "lightweight"]

authors = [
    { name = "Ertan Tunç Türk", email = "ertantuncturk61@gmail.com" }
]

maintainers = [
    { name = "Ertan Tunç Türk", email = "ertantuncturk61@gmail.com" }
]

dependencies = []

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/ertanturk/pyforge-test"
Documentation = "https://github.com/ertanturk/pyforge-test/blob/main/docs/Documentation.md"
Repository = "https://github.com/ertanturk/pyforge-test.git"
Issues = "https://github.com/ertanturk/pyforge-test/issues"
Changelog = "https://github.com/ertanturk/pyforge-test/releases"

[project.scripts]
pyforge = "pyforge_test.core.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyforge_test = ["core/py.typed"]

# ----------------------
# Ruff Configuration
# ----------------------

[tool.ruff]
line-length = 100
target-version = "py312"
fix = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplifications
    "RUF",  # Ruff-specific rules
    "PL",   # pylint subset
    "ARG"   # unused arguments
]

ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ----------------------
# Pyright Configuration
# ----------------------

[tool.pyright]
include = ["src/pyforge_test"]
exclude = ["**/node_modules", "**/__pycache__", ".venv", "src/pyforge_test/_version.py"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = "warning"
reportUnusedClass = "warning"
reportUnusedFunction = "warning"
reportUnusedVariable = "warning"
reportGeneralTypeIssues = "warning"
reportOptionalMemberAccess = "warning"
reportOptionalSubscript = "warning"

# ----------------------
# Coverage Configuration
# ----------------------

[tool.coverage.run]
source = ["src/pyforge_test"]
omit = ["*/__main__.py", "*/py.typed"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
precision = 2

# ----------------------
# Pylint Configuration
# ----------------------

[tool.pylint.messages]

[tool.pylint."messages control"]
disable = [
    "too-many-locals",  # Complex functions may legitimately have many local vars
    "too-many-arguments",  # Refactor if needed
    "duplicate-code",  # Allow duplicate logic in independent modules
    "fixme",  # Allow TODO, FIXME comments
]

[tool.pylint.design]
max-locals = 25
max-args = 8

[tool.pylint.format]
max-line-length = 100
indent-string = "    "

[tool.pylint.basic]
bad-names = ["l", "O", "I"]

[tool.pylint.variables]
allow-global-unused-variables = false